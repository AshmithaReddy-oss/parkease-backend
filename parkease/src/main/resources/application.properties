spring.application.name=ParkEase

server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parkease_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ===============================
# Frontend Configuration
# ===============================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# ===============================
# Initial Admin (local testing)
# ===============================
app.admin.email=${ADMIN_EMAIL:admin@parkease.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@Local1}