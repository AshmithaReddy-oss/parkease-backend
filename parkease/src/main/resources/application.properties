spring.application.name=ParkEase

server.port=${PORT:8080}

# ===============================
# Database Configuration
# Defaults to embedded persistent H2 (MySQL mode) so backend runs anywhere with zero setup.
# In production, set DB_URL (e.g. jdbc:mysql://... or jdbc:postgresql://...), DB_USER, and DB_PASS.
# ===============================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/parkease_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=${JWT_SECRET:dGhpc2lzYXNhZmVhbmR2ZXJ5c2VjdXJla2V5Zm9ycGFya2Vhc2VkZXZlbG9wbWVudDEyMw==}
app.jwt.expiration=86400000

# ===============================
# Frontend Configuration
# ===============================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# ===============================
# Initial Admin (local testing)
# ===============================
app.admin.email=${ADMIN_EMAIL:admin@parkease.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@Local1}